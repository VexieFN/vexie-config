<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="/manifest.json"><title>Desk</title>
<style>
:root{--bg:#000;--card:#1c1c1e;--tx:#fff;--t2:rgba(235,235,245,.6);--g:#00d35a;--r:#ff453a;--o:#ff9f0a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,system-ui,sans-serif;
padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));font-variant-numeric:tabular-nums}
h1{font-size:15px;font-weight:600;color:var(--t2);margin:20px 0 4px}
.bal{font-size:56px;font-weight:700;letter-spacing:-1px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;background:var(--card)}
.paper{background:var(--o);color:#000}.live{background:var(--r)}
.card{background:var(--card);border-radius:16px;padding:14px;margin:8px 0}
button{font:inherit;font-weight:600;border:0;border-radius:14px;min-height:56px;width:100%;color:#000}
#go{font-size:20px;margin:16px 0}.on{background:var(--r);color:#fff}.off{background:var(--g)}
a.btn{display:block;text-align:center;background:var(--g);color:#000;text-decoration:none;font-weight:600;border-radius:12px;padding:12px;margin-top:8px}
.pos{color:var(--g)}.neg{color:var(--r)}.sub{color:var(--t2);font-size:13px}
#err{color:var(--r);font-size:13px;min-height:16px}
input{width:100%;min-height:44px;border-radius:10px;border:0;background:#2c2c2e;color:#fff;padding:0 10px;font:inherit}
</style></head><body>
<div class="row"><div class="bal" id="bal">–</div><span class="pill" id="mode"></span></div>
<div class="sub" id="pnl">&nbsp;</div><div id="err"></div>
<button id="go" class="off">…</button>
<div class="sub" id="status"></div>
<h1>Posizioni aperte</h1><div id="open"><div class="sub">Nessuna</div></div>
<h1>Attività</h1><div id="act"></div>
<h1>Impostazioni rapide</h1>
<div class="card"><div class="sub">Stop %</div><input id="s_stop" type="number" step="0.5" inputmode="decimal">
<div class="sub" style="margin-top:8px">Stack % per trade</div><input id="s_pct" type="number" step="0.5" inputmode="decimal"></div>
<script src="app.js"></script></body></html>
